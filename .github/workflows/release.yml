name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Download FFmpeg binaries for bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path backend/bin | Out-Null
          $zipPath = "$env:TEMP\ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          $extractDir = "$env:TEMP\ffmpeg-extract"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extractDir
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "backend/bin/ffmpeg.exe" -Force
          Copy-Item $ffprobeExe.FullName -Destination "backend/bin/ffprobe.exe" -Force

      - name: Build Python backend (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller --noconfirm nicotube-backend.spec

      - name: Build UI bundle
        run: npm run build:ui

      - name: Build & publish Windows installers (NSIS Setup + Portable + latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
